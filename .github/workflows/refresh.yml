name: Refresh Data

# vaila shares the Supabase Postgres with vacansee. This workflow is
# kicked off by vacansee's update-timetable pipeline after it finishes
# scraping + uploading — we then rebuild vaila's public artifacts
# (scheduleData.json, per-teacher metadata) off the same DB.

on:
  repository_dispatch:
    types: [vacansee-data-updated]
  workflow_dispatch:
  schedule:
    # Safety-net daily run at 05:30 UTC (09:30 GST) in case the
    # repository_dispatch trigger ever drops.
    - cron: "30 5 * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: vaila-refresh
      cancel-in-progress: false

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "scripts/requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Verify environment
        run: |
          if [ -z "${SUPABASE_URL:-}" ]; then
            echo "::error::SUPABASE_URL secret is not set!"
            exit 1
          fi
          if [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "::error::SUPABASE_SERVICE_ROLE_KEY secret is not set!"
            exit 1
          fi
          echo "Supabase environment variables verified."

      - name: Fetch latest classes.csv from vacansee
        run: |
          curl -sSfL https://raw.githubusercontent.com/tahayparker/vacansee/main/public/classes.csv -o public/classes.csv

      - name: Sync teachers table
        run: python scripts/update_teachers.py

      - name: Regenerate schedule JSON
        run: python scripts/generate_schedule.py

      - name: Format scheduleData.json
        run: |
          npx prettier public/scheduleData.json --write || true

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "Taha Parker"
          git config user.email "98612931+tahayparker@users.noreply.github.com"
          git add public/scheduleData.json public/classes.csv
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "data: refresh scheduleData.json and classes.csv [skip deploy]"

          for attempt in 1 2 3; do
            if git push origin main; then
              echo "Successfully pushed updated schedule data."
              exit 0
            fi
            echo "Push attempt $attempt failed. Rebasing against origin/main..."
            git pull --rebase origin main || true
            sleep 3
          done
          echo "::error::Failed to push changes after 3 attempts."
          exit 1
